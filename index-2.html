<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Привет — отправитель</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600;900&family=Geologica:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0a0a0f; --surface:#13131a; --border:#1e1e2e; --accent:#c8f135; --accent2:#7b5ea7; --text:#e8e8f0; --muted:#5a5a72; }
  body { background:var(--bg); color:var(--text); font-family:'Geologica',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  .blob { position:fixed; border-radius:50%; filter:blur(100px); opacity:0.12; pointer-events:none; animation:drift 12s ease-in-out infinite alternate; }
  .blob-1 { width:500px; height:500px; background:var(--accent); top:-150px; left:-100px; }
  .blob-2 { width:400px; height:400px; background:var(--accent2); bottom:-100px; right:-80px; animation-delay:-4s; }
  .blob-3 { width:300px; height:300px; background:#3a86ff; top:50%; left:50%; transform:translate(-50%,-50%); animation-delay:-8s; }
  @keyframes drift { from{transform:translate(0,0) scale(1);} to{transform:translate(30px,20px) scale(1.05);} }
  .card { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:52px 48px 44px; width:min(480px,92vw); box-shadow:0 40px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.04) inset; animation:cardIn 0.6s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes cardIn { from{opacity:0;transform:translateY(32px) scale(0.97);} to{opacity:1;transform:translateY(0) scale(1);} }
  .tag { display:inline-flex; align-items:center; gap:6px; background:rgba(200,241,53,0.1); border:1px solid rgba(200,241,53,0.25); border-radius:999px; padding:4px 12px; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); margin-bottom:24px; font-family:'Unbounded',sans-serif; font-weight:300; }
  .tag-dot { width:6px; height:6px; background:var(--accent); border-radius:50%; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.4;transform:scale(0.7);} }
  h1 { font-family:'Unbounded',sans-serif; font-weight:900; font-size:clamp(28px,6vw,38px); line-height:1.1; letter-spacing:-0.03em; margin-bottom:10px; }
  h1 span { color:var(--accent); }
  .subtitle { color:var(--muted); font-size:14px; font-weight:300; margin-bottom:36px; line-height:1.5; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; font-family:'Unbounded',sans-serif; font-weight:300; }
  .field input { width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:12px; padding:14px 18px; color:var(--text); font-family:'Geologica',sans-serif; font-size:15px; outline:none; transition:border-color 0.2s,box-shadow 0.2s; }
  .field input::placeholder { color:var(--muted); }
  .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(200,241,53,0.1); }
  .preview { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin-bottom:28px; display:flex; align-items:center; gap:12px; }
  .preview-icon { font-size:22px; flex-shrink:0; }
  .preview-text { font-size:13px; color:var(--muted); line-height:1.5; }
  .preview-text strong { display:block; color:var(--text); font-size:15px; font-weight:400; margin-bottom:2px; }
  button { width:100%; background:var(--accent); color:#0a0a0f; border:none; border-radius:12px; padding:16px; font-family:'Unbounded',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.04em; cursor:pointer; transition:transform 0.15s,box-shadow 0.2s,opacity 0.2s; }
  button:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 12px 32px rgba(200,241,53,0.35); }
  button:active:not(:disabled) { transform:translateY(0); }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,0.3); border-top-color:#0a0a0f; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to{transform:rotate(360deg);} }
  .status { margin-top:16px; border-radius:10px; padding:12px 16px; font-size:13px; display:none; align-items:flex-start; gap:10px; animation:fadeUp 0.3s ease both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  .status.show { display:flex; }
  .status.success { background:rgba(200,241,53,0.1); border:1px solid rgba(200,241,53,0.25); color:var(--accent); }
  .status.error { background:rgba(255,80,80,0.1); border:1px solid rgba(255,80,80,0.25); color:#ff8080; }
  .status-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div class="card">
  <div class="tag"><span class="tag-dot"></span>Почтовый отправитель</div>
  <h1>Скажем<br><span>«Привет»</span></h1>
  <p class="subtitle">Укажите email — и мы мгновенно отправим туда тёплое приветствие.</p>
  <div class="field">
    <label>Адрес получателя</label>
    <input type="email" id="emailInput" placeholder="example@mail.ru" />
  </div>
  <div class="preview">
    <div class="preview-icon">✉️</div>
    <div class="preview-text">
      <strong>привет</strong>
      Именно это сообщение придёт на вашу почту
    </div>
  </div>
  <button id="sendBtn" onclick="sendEmail()">Отправить привет →</button>
  <div class="status" id="statusBox">
    <span class="status-icon" id="statusIcon"></span>
    <span id="statusText"></span>
  </div>
</div>
<script>
async function sendEmail() {
  const email = document.getElementById("emailInput").value.trim();
  const btn = document.getElementById("sendBtn");
  if (!email || !email.includes("@")) { showStatus("error","⚠️","Введите корректный email-адрес."); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Отправляем…';
  try {
    const res = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (data.ok) showStatus("success","✅",`Письмо «привет» успешно отправлено на ${email}!`);
    else showStatus("error","❌","Ошибка: " + data.error);
  } catch(e) {
    showStatus("error","❌","Ошибка: " + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Отправить привет →";
  }
}
function showStatus(type, icon, msg) {
  const box = document.getElementById("statusBox");
  document.getElementById("statusIcon").textContent = icon;
  document.getElementById("statusText").textContent = msg;
  box.className = "status show " + type;
}
document.getElementById("emailInput").addEventListener("keydown", e => { if(e.key==="Enter") sendEmail(); });
</script>
</body>
</html>
